function listenUpdates(callback,onStatus=()=>{}){
  let es;

}
function playStampSound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC(),duration=.14,length=Math.ceil(ctx.sampleRate*duration),buffer=ctx.createBuffer(1,length,ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++){let t=i/ctx.sampleRate;data[i]=(Math.random()*2-1)*Math.exp(-38*t)}const source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();source.buffer=buffer;filter.type='lowpass';filter.frequency.value=720;gain.gain.value=.63;source.connect(filter);filter.connect(gain);gain.connect(ctx.destination);source.start();source.onended=()=>ctx.close()}catch{}}

if(mode==='visitor'){(new Function("'use strict';\nlet person=null,siteState=null,viewStop=0,lastActive=null,selectedAnswers=new Set(),taskRenderKey='',temporaryPending=[];\nconst PERSON_KEY='ttks.sauBen.person';const PENDING_KEY='ttks.sauBen.pending';\nfunction savedPerson(){try{return JSON.parse(localStorage.getItem(PERSON_KEY))}catch{return null}}\nfunction pendingList(){try{return JSON.parse(localStorage.getItem(PENDING_KEY))||[]}catch{return []}}\nfunction setPerson(p){person=p;localStorage.setItem(PERSON_KEY,JSON.stringify(p))}\nfunction updateConnection(online){$('connection').classList.toggle('online',online);$('connection').classList.toggle('offline',!online);$('connectionText').textContent=online?'Đã nối với chuyến đò':'Mạng yếu · sẽ thử kết nối lại';if(online)syncPending()}\nasync function start(){person=savedPerson();temporaryPending=pendingList();if(person){try{const result=await api('/api/state?id='+encodeURIComponent(person.id));if(!result.person.id)throw new Error('Sổ cũ không còn hiệu lực');setPerson(result.person);applyState(result);}catch(e){if(e.message==='Sổ cũ không còn hiệu lực'){localStorage.removeItem(PERSON_KEY);person=null}else{siteState={activeStation:0,phase:'intro',unlocked:[],counts:{visitors:0,completed:0,stamps:[0,0,0,0,0,0]}};updateConnection(false)}}}\n if(person){showJourney();renderJourney()}else showWelcome();listenUpdates(applyState,updateConnection);\n $('joinForm').addEventListener('submit',join);\n $('helpBtn').addEventListener('click',()=>toast('Theo dõi hướng dẫn viên. Khi bến mở, hoàn thành nhiệm vụ trên điện thoại để nhận dấu. Bấm một bến đã mở để xem lại.'));\n $('backupToggle').addEventListener('click',()=>$('backupForm').classList.toggle('hidden'));\n $('backupForm').addEventListener('submit',submitBackup);\n $('dockList').addEventListener('click',e=>{const btn=e.target.closest('[data-dock]');if(!btn||btn.disabled)return;viewStop=Number(btn.dataset.dock);selectedAnswers.clear();taskRenderKey='';renderJourney();$('taskArea').scrollIntoView({behavior:'smooth',block:'start'})});\n $('logoutBtn').addEventListener('click',()=>{if(confirm('Mở sổ mới sẽ không chuyển dấu của sổ cũ sang sổ mới. Bạn muốn tiếp tục?')){localStorage.removeItem(PERSON_KEY);person=null;viewStop=0;showWelcome()}});\n $('saveCertificate').addEventListener('click',saveCertificate);\n $('backToJourney').addEventListener('click',()=>{showJourney();renderJourney()});\n $('taskArea').addEventListener('click',taskClick);\n window.addEventListener('online',syncPending);\n}\nfunction showWelcome(){$('welcomeScreen').classList.remove('hidden');$('journeyScreen').classList.add('hidden');$('certificateScreen').classList.add('hidden')}\nfunction showJourney(){$('welcomeScreen').classList.add('hidden');$('journeyScreen').classList.remove('hidden');$('certificateScreen').classList.add('hidden')}\nfunction showCertificate(){$('welcomeScreen').classList.add('hidden');$('journeyScreen').classList.add('hidden');$('certificateScreen').classList.remove('hidden');$('certName').textContent=person.name;$('certStamps').innerHTML=DOCKS.map(s=>`<div class=\"cert-stamp\"><span>${s.icon}</span><small>${safe(s.seal.toUpperCase())}</small></div>`).join('');window.scrollTo({top:0,behavior:'smooth'})}\nasync function join(e){e.preventDefault();const name=$('nickname').value.trim();if(!name)return;$('joinButton').disabled=true;$('joinError').textContent='';try{const result=await post('/api/join',{name});setPerson(result.person);applyState(result.state);showJourney();renderJourney()}catch(err){$('joinError').textContent='Không thể lên đò: '+err.message+'. Kiểm tra mạng hoặc máy chủ.'}finally{$('joinButton').disabled=false}}\nfunction applyState(st){if(!st||!Object.hasOwn(st,'activeStation'))return;siteState=st;\n if(lastActive!==st.activeStation){if(st.activeStation>0)viewStop=st.activeStation;lastActive=st.activeStation;selectedAnswers.clear();taskRenderKey=''}\n if(person && !$('journeyScreen').classList.contains('hidden'))renderJourney();\n}\nfunction stamps(){return person?.stamps||[]}\nfunction isDone(n){return stamps().includes(n)}\nfunction renderJourney(){if(!person)return;let s=siteState||{activeStation:0,phase:'intro',unlocked:[]};$('visitorName').textContent=person.name;$('stampCount').innerHTML=`${stamps().length}<span>/6</span>`;$('progressFill').style.width=`${stamps().length/6*100}%`;\n $('stampGrid').innerHTML=DOCKS.map(d=>`<div class=\"seal-tile ${isDone(d.id)?'stamped':''}\"><span class=\"seal-shape\">${isDone(d.id)?d.icon:'◌'}</span><small>${safe(d.seal)}</small></div>`).join('');\n const current=DOCKS.find(d=>d.id===s.activeStation);\n if(!current){$('liveEyebrow').textContent='CHỜ HƯỚNG DẪN VIÊN';$('currentTitle').textContent='Chuyến đò sắp khởi hành';$('liveDescription').textContent='Đừng đóng sổ nhé. Khi hướng dẫn viên giới thiệu bến đầu tiên, màn hình này sẽ tự thay đổi.';}\n else{$('liveEyebrow').textContent=s.phase==='challenge'?'NHIỆM VỤ ĐANG MỞ':'ĐOÀN ĐÃ CẬP BẾN';$('currentTitle').textContent=`Bến ${pad(current.id)} · ${current.title}`;$('liveDescription').textContent=s.phase==='challenge'?'Cả đoàn cùng tham gia ngay trên điện thoại để nhận dấu mộc.':current.desc+' — hãy nghe câu chuyện của người dân, nhiệm vụ sẽ mở sau phần thuyết minh.';}\n $('dockList').innerHTML=DOCKS.map(d=>{const enabled=s.unlocked?.includes(d.id)||d.id===s.activeStation||isDone(d.id),pending=temporaryPending.some(x=>x.station===d.id);return `<button type=\"button\" data-dock=\"${d.id}\" class=\"dock-item ${isDone(d.id)?'done':''} ${d.id===s.activeStation?'active':''}\" ${enabled?'':'disabled'}><span class=\"dock-number\">${pad(d.id)}</span><span class=\"dock-main\"><strong>${safe(d.title)}</strong><small>${safe(d.desc)}</small></span><span class=\"dock-tail\">${isDone(d.id)?'✓':pending?'⏳':enabled?'↗':'🔒'}</span></button>`}).join('');\n if(!viewStop||(!s.unlocked?.includes(viewStop)&&viewStop!==s.activeStation&&!isDone(viewStop)))viewStop=s.activeStation;\n let renderKey=[viewStop,s.phase,(s.unlocked||[]).join(','),stamps().join(','),temporaryPending.map(x=>x.station).join(',')].join('|');if(taskRenderKey!==renderKey){taskRenderKey=renderKey;renderTask()}\n}\nfunction renderTask(){const area=$('taskArea');let st=DOCKS.find(x=>x.id===viewStop),s=siteState;if(!st){area.innerHTML='<div class=\"locked-card\"><div class=\"locked-icon\">⛵</div><h3>Đò chưa rời bến</h3><p>Hai hướng dẫn viên Mai và Hạ sẽ mời cả đoàn lên đường sau ít phút.</p></div>';return}\n if(temporaryPending.some(p=>p.station===st.id)&&!isDone(st.id)){area.innerHTML=`<div class=\"locked-card\"><div class=\"locked-icon\">⏳</div><h3>Dấu đang chờ đồng bộ</h3><p>Bạn đã thực hiện nhiệm vụ khi mạng yếu. Website sẽ gửi lại khi có kết nối; dấu chính thức chỉ được ghi sau khi máy chủ xác nhận.</p></div>`;return}\n if(isDone(st.id)){area.innerHTML=`<div class=\"task-card stamped-message\"><div class=\"seal-shape\">${st.icon}</div><h4>Đã ghi dấu ${safe(st.seal)}!</h4><p>Chuyến đò đã lưu kỷ niệm ở bến này vào sổ của bạn. ${st.id<6?'Sẵn sàng cho bến kế tiếp nhé.':'Cảm ơn bạn đã lắng nghe phương Nam.'}</p>${st.id===6&&stamps().length===6?'<button class=\"primary-btn task-primary\" data-certificate=\"1\">Mở trang hoàn thành ↗</button>':''}</div>`;return}\n if(!(s.unlocked||[]).includes(st.id)){area.innerHTML=`<div class=\"locked-card\"><div class=\"locked-icon\">⌛</div><h3>Hãy nghe chuyện ở bến ${pad(st.id)}</h3><p>Nhiệm vụ chưa được hướng dẫn viên mở. Bạn cứ theo dõi phần diễn, khi đến lượt sẽ tự hiện lên đây nhé.</p></div>`;return}\n selectedAnswers.clear();const questions={\n 1:{prompt:'Bạn muốn đến vùng đất có mạng lưới <strong>kênh rạch và văn hóa chợ nổi</strong>. Hãy chọn tuyến phù hợp.',art:'<div class=\"task-illustration\"><div class=\"canal-labels\"><span>ĐÔNG NAM BỘ</span><span>TÂY NAM BỘ</span></div><div class=\"canal-bank\"></div><div class=\"canal-water\"></div><div class=\"canal-boat\" id=\"canalBoat\">🛶</div></div>',options:[['dong-nam-bo','⛰️','Đông Nam Bộ','Địa hình tương đối cao, nhiều đô thị và công nghiệp'],['tay-nam-bo','🌊','Tây Nam Bộ','Mạng lưới kênh rạch dày đặc, chợ nổi, đồng bằng phù sa']]},\n 2:{prompt:'Ghe của Chị Hai đang bán <strong>dứa</strong>. Bạn sẽ treo món hàng nào lên cây bẹo để khách từ xa nhận ra?',art:'<div class=\"pole-scene\"><div class=\"pole-stick\"></div><div class=\"pole-fruit\" id=\"poleFruit\">🍍</div><div class=\"pole-boat\"></div></div>',options:[['dua','🍍','Dứa',''],['dua-dua','🥥','Dừa',''],['chom-chom','🍒','Chôm chôm','']]},\n 3:{prompt:'Trong ba hình ảnh dưới đây, đâu là <strong>di sản văn hóa phi vật thể</strong>?',options:[['dinh-doc-lap','🏛️','Dinh Độc Lập','Công trình kiến trúc – lịch sử'],['don-ca-tai-tu','🎶','Đờn ca tài tử','Nghệ thuật trình diễn đặc trưng của Nam Bộ'],['rung-can-gio','🌳','Rừng ngập mặn Cần Giờ','Hệ sinh thái thiên nhiên']]},\n 4:{prompt:'Giúp Chị Ba xếp giỏ dự trữ: người dân có thể <strong>chế biến cá theo những cách nào để bảo quản lâu hơn</strong>? Chọn hai cách.',art:'<div class=\"basket-scene\"><div class=\"basket-items\" id=\"basketItems\"></div><span class=\"basket\">🧺</span></div>',options:[['lam-mam','🫙','Làm mắm','Dùng kỹ thuật lên men và muối'],['phoi-kho','🐟','Phơi khô','Giảm độ ẩm để bảo quản'],['an-ngay','🍲','Ăn ngay','Dùng trong bữa ăn hiện tại'],['de-tu-nhien','🌡️','Để nguyên ở nhiệt độ thường','Không xử lý hay bảo quản']]},\n 5:{prompt:'Một người biết đến hoạt động cộng đồng qua <strong>lời giới thiệu của hàng xóm thân thiết</strong>. Nguồn thông tin nào dễ tạo sự quan tâm ban đầu hơn trong tình huống này?',options:[['nguoi-la','❔','Một người lạ chưa kiểm chứng','Thông tin không có nguồn xác nhận'],['nguoi-quen-tin-cay','🤝','Người quen đáng tin','Có lời chia sẻ cụ thể và thông tin rõ ràng']]},\n 6:{prompt:'Bạn đang mời bà con <strong>dọn vệ sinh bến sông</strong>. Hãy chọn lời mời rõ ràng, thiết thực và dễ tham gia nhất.',options:[['chung-chung','☁️','Cùng nâng cao nhận thức vì môi trường bền vững!',''],['loi-moi-cu-the','📍','7 giờ sáng Chủ nhật, bà con tập trung tại nhà văn hóa để cùng dọn sạch bến sông nhé!',''],['chung-tay','💬','Hãy chung tay hành động khi có thời gian rảnh.','']]}\n };let q=questions[st.id];area.innerHTML=`<div class=\"task-card\"><div class=\"task-heading\"><span class=\"task-no\">${pad(st.id)}</span><div><span class=\"smallcap\">NHIỆM VỤ · DẤU ${safe(st.seal.toUpperCase())}</span><h3>${safe(st.title)}</h3></div></div><p class=\"task-prompt\">${q.prompt}</p>${q.art||''}<div class=\"task-options\">${q.options.map(o=>`<button class=\"option-card\" type=\"button\" data-answer=\"${o[0]}\"><span class=\"option-emoji\">${o[1]}</span><span class=\"option-text\"><strong>${safe(o[2])}</strong>${o[3]?`<small>${safe(o[3])}</small>`:''}</span><span class=\"option-check\"></span></button>`).join('')}</div>${st.id===4?'<button class=\"primary-btn task-primary\" id=\"basketSubmit\" data-submit=\"1\">Xếp giỏ & hoàn thành →</button>':''}<div class=\"task-hint\" id=\"taskHint\" role=\"status\"></div></div>`;\n}\nasync function taskClick(event){const cert=event.target.closest('[data-certificate]');if(cert){showCertificate();return}const sel=event.target.closest('[data-answer]');const submit=event.target.closest('[data-submit]');if(!sel&&!submit)return;if(sel){const value=sel.dataset.answer;if(viewStop===4){if(selectedAnswers.has(value))selectedAnswers.delete(value);else selectedAnswers.add(value);document.querySelectorAll('#taskArea [data-answer]').forEach(el=>{el.classList.toggle('selected',selectedAnswers.has(el.dataset.answer));el.querySelector('.option-check').textContent=selectedAnswers.has(el.dataset.answer)?'✓':''});$('basketItems').textContent=(selectedAnswers.has('lam-mam')?'🫙':'')+(selectedAnswers.has('phoi-kho')?'🐟':'');return}\n selectedAnswers=new Set([value]);document.querySelectorAll('#taskArea [data-answer]').forEach(el=>el.disabled=true);\n const correct={1:'tay-nam-bo',2:'dua',3:'don-ca-tai-tu',5:'nguoi-quen-tin-cay',6:'loi-moi-cu-the'}[viewStop];if(value!==correct){$('taskHint').textContent='Chưa đúng rồi! Quan sát lời gợi ý trên sân khấu và thử lại nhé.';setTimeout(()=>document.querySelectorAll('#taskArea [data-answer]').forEach(el=>el.disabled=false),300);return}\n if(viewStop===1){const boat=$('canalBoat');if(boat)boat.classList.add('sail')}\n if(viewStop===2){const fruit=$('poleFruit');if(fruit)fruit.classList.add('hung')}\n await complete(viewStop,[value]);}\n if(submit){const answers=[...selectedAnswers];if(answers.length!==2){$('taskHint').textContent='Bạn cần chọn đúng hai cách bảo quản trước khi xếp giỏ.';return}if(!selectedAnswers.has('lam-mam')||!selectedAnswers.has('phoi-kho')){$('taskHint').textContent='Hãy nghĩ đến những cách làm mắm và phơi khô được Chị Ba kể nhé.';return}submit.disabled=true;await complete(viewStop,answers);}\n}\nasync function complete(station,answers,backup){if(!person)return;const stop=DOCKS.find(d=>d.id===station);try{const r=await post('/api/complete',{id:person.id,station,answers,backup});setPerson(r.person);temporaryPending=temporaryPending.filter(q=>q.station!==station);localStorage.setItem(PENDING_KEY,JSON.stringify(temporaryPending));playStampSound();try{navigator.vibrate?.(45)}catch{}showStamp(stop);taskRenderKey='';renderJourney();if(stamps().length===6)setTimeout(()=>showCertificate(),2200)}catch(err){if(!navigator.onLine||/fetch|network|Failed/i.test(err.message)){temporaryPending=temporaryPending.filter(p=>p.station!==station);temporaryPending.push({station,answers,backup});localStorage.setItem(PENDING_KEY,JSON.stringify(temporaryPending));taskRenderKey='';renderJourney();toast('Mạng yếu: nhiệm vụ đang chờ đồng bộ lại')}else{const hint=$('taskHint');if(hint)hint.textContent=err.message;document.querySelectorAll('#taskArea [data-answer], #basketSubmit').forEach(el=>el.disabled=false)}}}\nlet stampTimeout;\nfunction showStamp(stop){$('overlayStamp').textContent=stop.seal.toUpperCase();$('stampOverlay').classList.remove('hidden');clearTimeout(stampTimeout);stampTimeout=setTimeout(()=>$('stampOverlay').classList.add('hidden'),1500)}\nasync function syncPending(){if(!person||!temporaryPending.length||syncPending.running)return;syncPending.running=true;for(const entry of [...temporaryPending]){try{let r=await post('/api/complete',{id:person.id,...entry});setPerson(r.person);temporaryPending=temporaryPending.filter(x=>x.station!==entry.station);localStorage.setItem(PENDING_KEY,JSON.stringify(temporaryPending));taskRenderKey='';renderJourney();toast('Đã đồng bộ dấu '+DOCKS[entry.station-1].seal)}catch{}}syncPending.running=false}\nasync function submitBackup(e){e.preventDefault();const code=$('backupInput').value.trim().toUpperCase();const index=BACKUP_CODES.indexOf(code);if(index<0){$('backupError').textContent='Mã chưa đúng, hãy hỏi lại hướng dẫn viên.';return}if(isDone(index+1)){$('backupError').textContent='Bạn đã có dấu này trong sổ rồi.';return}$('backupError').textContent='';await complete(index+1,[],code);$('backupInput').value='';$('backupForm').classList.add('hidden')}\nfunction drawWrapped(ctx,text,x,y,maxWidth,lineHeight){const words=text.split(' ');let line='',yy=y;for(const word of words){const trial=line?line+' '+word:word;if(ctx.measureText(trial).width>maxWidth && line){ctx.fillText(line,x,yy);yy+=lineHeight;line=word}else line=trial}if(line)ctx.fillText(line,x,yy);return yy}\nfunction saveCertificate(){const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1440;const ctx=canvas.getContext('2d');ctx.fillStyle='#f5ebd7';ctx.fillRect(0,0,1080,1440);ctx.fillStyle='#fff9e9';ctx.fillRect(42,42,996,1356);ctx.strokeStyle='#c6aa83';ctx.lineWidth=3;ctx.strokeRect(65,65,950,1310);ctx.strokeStyle='#decbb0';ctx.lineWidth=2;ctx.strokeRect(81,81,918,1278);ctx.textAlign='center';ctx.fillStyle='#b05244';ctx.font='56px Georgia';ctx.fillText('❧  ✦  ❧',540,170);ctx.fillStyle='#244941';ctx.font='bold 23px Arial';ctx.fillText('TAM THANH KỲ SẮC  ·  NHÓM 1',540,231);ctx.fillStyle='#a35d4b';ctx.font='24px Georgia';ctx.fillText('CHUYẾN ĐÒ XUYÊN TRANG SÁCH',540,305);ctx.fillStyle='#244941';ctx.font='bold 76px Georgia';ctx.fillText('HOÀN THÀNH',540,410);ctx.fillStyle='#b05244';ctx.font='italic 79px Georgia';ctx.fillText('HÀNH TRÌNH',540,498);ctx.font='40px Georgia';ctx.fillText('✦      06 / 06      ✦',540,575);ctx.fillStyle='#736f5f';ctx.font='26px Georgia';ctx.fillText('Trao tặng người bạn đồng hành phương Nam',540,635);ctx.fillStyle='#244941';ctx.font='bold 52px Georgia';let name=person.name;while(ctx.measureText(name).width>880&&name.length>1)ctx.font=`bold ${Math.max(28,parseInt(ctx.font.match(/\\d+/)[0])-2)}px Georgia`;ctx.fillText(name,540,709);\n DOCKS.forEach((st,i)=>{const cx=232+(i%3)*308,cy=850+Math.floor(i/3)*184;ctx.save();ctx.translate(cx,cy);ctx.rotate((i%2?8:-10)*Math.PI/180);ctx.strokeStyle='#b05244';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,73,0,2*Math.PI);ctx.stroke();ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,66,0,2*Math.PI);ctx.stroke();ctx.textAlign='center';ctx.fillStyle='#b05244';ctx.font='bold 20px Arial';ctx.fillText(st.seal.toUpperCase(),0,7);ctx.font='21px Georgia';ctx.fillText(pad(i+1),0,-28);ctx.restore()});ctx.fillStyle='#6e7967';ctx.textAlign='center';ctx.font='italic 27px Georgia';drawWrapped(ctx,'Đi qua một vùng đất là ngắm nhìn cảnh vật. Hiểu một vùng văn hóa là biết lắng nghe con người.',540,1240,790,39);ctx.fillStyle='#ac9775';ctx.font='bold 16px Arial';ctx.fillText('SÁU BẾN PHƯƠNG NAM  ·  KỶ NIỆM HÀNH TRÌNH',540,1350);\n canvas.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='so-hanh-trinh-'+person.name.replace(/[^\\p{L}\\p{N}-]+/gu,'-')+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)},'image/png')}\nstart();\n"))()}

\"color:#baa076\">/</span> ${pad(stageTotalSlides||46)}</div></div>`;prevSlide=s.slide}\n if(s.mode==='video')area.innerHTML=videoHTML();\n if(s.mode==='finish')area.innerHTML=finishHTML();\n const station=DOCKS.find(d=>d.id===live.activeStation);$('stageActiveLabel').textContent=station?`BẾN ${pad(station.id)} · ${station.title.toUpperCase()}`:'CHUYẾN ĐÒ XUYÊN TRANG SÁCH';$('stageStats').textContent=`${live.counts?.visitors||0} du khách · ${live.counts?.completed||0} đủ dấu`;\n $('stageDots').innerHTML=DOCKS.map(d=>`<div class=\"stage-dot ${live.unlocked.includes(d.id)?'done':''} ${live.activeStation===d.id?'active':''}\" title=\"Dấu ${safe(d.seal)}\"></div>`).join('');$('stageProgress').style.display=showHint?'flex':'none';\n}\nlet msgTimer;function stageToast(msg){let el=$('stageToast');el.textContent=msg;el.classList.add('show');clearTimeout(msgTimer);msgTimer=setTimeout(()=>el.classList.remove('show'),2500)}\nfunction stateUpdate(s){if(!s?.stage)return;const old=live,changed=JSON.stringify(live.stage)!==JSON.stringify(s.stage),newStamp=(s.counts?.completed||0)>(live.counts?.completed||0);live=s;override=null;if(changed||newStamp)renderStage();else{let c=$('stageStats');if(c)c.textContent=`${live.counts.visitors} du khách · ${live.counts.completed} đủ dấu`;$('stageDots').innerHTML=DOCKS.map(d=>`<div class=\"stage-dot ${live.unlocked.includes(d.id)?'done':''} ${live.activeStation===d.id?'active':''}\"></div>`).join('');const st=DOCKS.find(d=>d.id===live.activeStation);$('stageActiveLabel').textContent=st?`BẾN ${pad(st.id)} · ${st.title.toUpperCase()}`:'CHUYẾN ĐÒ XUYÊN TRANG SÁCH'}\n if(changed &&s.stage.mode==='book'&&s.stage.slide!==old.stage?.slide)stageToast('Trang '+pad(s.stage.slide)+' / 46');\n if(newStamp&&s.stage.mode==='finish')stageToast('Thêm một du khách đủ sáu dấu!')\n}\nasync function stageControl(mode,slide,scene){const token=sessionStorage.getItem(ADMIN_TOKEN);if(token){try{await post('/api/admin/stage',{mode,slide,scene}, {'Authorization':'Bearer '+token});return}catch{}}\n override={mode,slide,scene};renderStage();stageToast('Đang chuyển trang trên máy chiếu (cục bộ)')}\nfunction setupStage(){\n $('toggleTools')?.addEventListener('click',()=>$('stageTools')?.classList.toggle('expanded'));\n $('stageFullscreen')?.addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{})});\n document.addEventListener('keydown',e=>{if(e.target.closest('input,audio'))return;if(e.key==='ArrowLeft')stageControl('book',Math.max(1,(override||live.stage).slide-1),(override||live.stage).scene);if(e.key==='ArrowRight')stageControl('book',Math.min(stageTotalSlides||46,(override||live.stage).slide+1),(override||live.stage).scene);if(e.key.toLowerCase()==='f'&&e.key.length===1){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{})}});\n const assetChannel=('BroadcastChannel' in window)?new BroadcastChannel('ttks_assets'):null;\n if(assetChannel){assetChannel.onmessage=async e=>{if(e.data?.action==='reload'){if(e.data.totalPages)stageTotalSlides=e.data.totalPages;await loadAssets();renderStage()}else if(e.data?.action==='slotMedia'){await loadAllSlotMedia();renderStage()}else if(e.data?.action==='toggleHint'){showHint=!showHint;let sp=$('stageProgress');if(sp)sp.style.display=showHint?'flex':'none'}}}\n loadAssets();loadAllSlotMedia();api('/api/state').then(stateUpdate).catch(()=>{});listenUpdates(stateUpdate,()=>{});\n}\nsetupStage();\n"))()}
