k',()=>$('backupForm').classList.toggle('hidden'));\n $('backupForm').addEventListener('submit',submitBackup);\n $('dockList').addEventListener('click',e=>{const btn=e.target.closest('[data-dock]');if(!btn||btn.disabled)return;viewStop=Number(btn.dataset.dock);selectedAnswers.clear();taskRenderKey='';renderJourney();$('taskArea').scrollIntoView({behavior:'smooth',block:'start'})});\n $('logoutBtn').addEventListener('click',()=>{if(confirm('M\u1edf s\u1ed5 m\u1edbi s\u1ebd kh\u00f4ng chuy\u1ec3n d\u1ea5u c\u1ee7a s\u1ed5 c\u0169 sang s\u1ed5 m\u1edbi. B\u1ea1n mu\u1ed1n ti\u1ebfp t\u1ee5c?')){localStorage.removeItem(PERSON_KEY);person=null;viewStop=0;showWelcome()}});\n $('saveCertificate').addEventListener('click',saveCertificate);\n $('backToJourney').addEventListener('click',()=>{showJourney();renderJourney()});\n $('taskArea').addEventListener('click',taskClick);\n window.addEventListener('online',syncPending);\n}\nfunction showWelcome(){$('welcomeScreen').classList.remove('hidden');$('journeyScreen').classList.add('hidden');$('certificateScreen').classList.add('hidden')}\nfunction showJourney(){$('welcomeScreen').classList.add('hidden');$('journeyScreen').classList.remove('hidden');$('certificateScreen').classList.add('hidden')}\nfunction showCertificate(){$('welcomeScreen').classList.add('hidden');$('journeyScreen').classList.add('hidden');$('certificateScreen').classList.remove('hidden');$('certName').textContent=person.name;$('certStamps').innerHTML=DOCKS.map(s=>`<div class=\"cert-stamp\"><span>${s.icon}</span><small>${safe(s.seal.toUpperCase())}</small></div>`).join('');window.scrollTo({top:0,behavior:'smooth'})}\nasync function join(e){e.preventDefault();const name=$('nickname').value.trim();if(!name)return;$('joinButton').disabled=true;$('joinError').textContent='';try{const result=await post('/api/join',{name});setPerson(result.person);applyState(result.state);showJourney();renderJourney()}catch(err){$('joinError').textContent='Kh\u00f4ng th\u1ec3 l\u00ea <span class=\"seal-shape\">${done?d.icon:(missed?'\u2715':'\u25cc')}</span><small>${missed?'L\u1ee1 d\u1ea5u':safe(d.seal)}</small></div>`}).join('');\n const current=DOCKS.find(d=>d.id===s.activeStation);\n if(!current){$('liveEyebrow').textContent='CH\u1edc H\u01af\u1edaNG D\u1eaaN VI\u00caN';$('currentTitle').textContent='Chuy\u1ebfn \u0111\u00f2 s\u1eafp kh\u1edfi h\u00e0nh';$('liveDescription').textContent='\u0110\u1eebng \u0111\u00f3ng s\u1ed5 nh\u00e9. Khi h\u01b0\u1edbng d\u1eabn vi\u00ean gi\u1edbi thi\u1ec7u b\u1ebfn \u0111\u1ea7u ti\u00ean, m\u00e0n h\u00ecnh n\u00e0y s\u1ebd t\u1ef1 thay \u0111\u1ed5i.';}\n else{$('liveEyebrow').textContent=s.phase==='challenge'?'NHI\u1ec6M V\u1ee4 \u0110ANG M\u1ede':'\u0110O\u00c0N \u0110\u00c3 C\u1eacP B\u1ebeN';$('currentTitle').textContent=`B\u1ebfn ${pad(current.id)} \u00b7 ${current.title}`;$('liveDescription').textContent=s.phase==='challenge'?'C\u1ea3 \u0111o\u00e0n c\u00f9ng tham gia ngay tr\u00ean \u0111i\u1ec7n tho\u1ea1i \u0111\u1ec3 nh\u1eadn d\u1ea5u m\u1ed9c.':current.desc+' \u2014 h\u00e3y nghe c\u00e2u chuy\u1ec7n c\u1ee7a ng\u01b0\u1eddi d\u00e2n, nhi\u1ec7m v\u1ee5 s\u1ebd m\u1edf sau ph\u1ea7n thuy\u1ebft minh.';}\n $('dockList').innerHTML=DOCKS.map(d=>{const done=isDone(d.id),missed=isFailed(d.id)&&!done;const enabled=s.unlocked?.includes(d.id)||d.id===s.activeStation||done||missed,pending=temporaryPending.some(x=>x.station===d.id);return `<button type=\"button\" data-dock=\"${d.id}\" class=\"dock-item ${done?'done':''} ${missed?'missed':''} ${d.id===s.activeStation?'active':''}\" ${enabled?'':'disabled'}><span class=\"dock-number\">${pad(d.id)}</span><span class=\"dock-main\"><strong>${safe(d.title)}</strong><small>${missed?'\u0110\u00e3 l\u1ee1 d\u1ea5u \u1edf b\u1ebfn n\u00e0y':safe(d.desc)}</small></span><span class=\"dock-tail\">${done?'\u2713':missed?'\u2715':pending?'\u23f3':enabled?'\u2197':'\ud83d\udd12'}</span></button>`}).join('');\n if(!viewStop||(!s.unlocked?.includes(viewStop)&&viewStop!==s.activeStation&&!isDone(viewStop)))viewStop=s.activeStation;\n let renderKey=[viewStop,s.phase,(s.unlocked||[]).join(','),stamps().join(','),temporaryPending.map(x=>x.station).join(','),stationStep[viewStop]||0,(s.questions?.[viewStop]?.length||s.questions?.[String(viewStop)]?.length||0)].join('|');if(taskRenderKey!==renderKey){taskRenderKey=renderKey;renderTask()}\n}\nfunction renderTask() {\n  const area = $('taskArea');\n  let st = DOCKS.find(x => x.id === viewStop), s = siteState;\n  if (!st) {\n    area.innerHTML = '<div class=\"locked-card\"><div class=\"locked-icon\">\u26f5</div><h3>\u0110\u00f2 ch\u01b0a r\u1eddi b\u1ebfn</h3><p>Hai h\u01b0\u1edbng d\u1eabn vi\u00ean Mai v\u00e0 H\u1ea1 s\u1ebd m\u1eddi c\u1ea3 \u0111o\u00e0n l\u00ean \u0111\u01b0\u1eddng sau \u00edt ph\u00fat.</p></div>';\n    return;\n  }\n  if (temporaryPending.some(p => p.station === st.id) && !isDone(st.id)) {\n    area.innerHTML = '<div class=\"locked-card\"><div class=\"locked-icon\">\u23f3</div><h3>D\u1ea5u \u0111ang ch\u1edd \u0111\u1ed3ng b\u1ed9</h3><p>B\u1ea1n \u0111\u00e3 th\u1ef1c hi\u1ec7n nhi\u1ec7m v\u1ee5 khi m\u1ea1ng y\u1ebfu. Website s\u1ebd g\u1eedi l\u1ea1i khi c\u00f3 k\u1ebft n\u1ed1i; d\u1ea5u ch\u00ednh th\u1ee9c ch\u1ec9 \u0111\u01b0\u1ee3c ghi sau khi m\u00e1y ch\u1ee7 x\u00e1c nh\u1eadn.</p></div>';\n    return;\n  }\n  if (isFailed(st.id) && !isDone(st.id)) {\n    const allFinished = DOCKS.every(d => isDone(d.id) || isFailed(d.id));\n    const showCert = (st.id === 6 || allFinished);\n    area.innerHTML = '<div class=\"task-card missed-message\">' +\n      '<div class=\"seal-shape\" style=\"font-size:32px;color:#b05244;margin-bottom:8px;\">\u2715</div>' +\n      '<h4>\u0110\u00e3 l\u1ee1 con d\u1ea5u ' + safe(st.seal) + '</h4>' +\n      '<p>B\u1ea1n \u0111\u00e3 ch\u1ecdn c\u00e2u tr\u1ea3 l\u1eddi ch\u01b0a ch\u00ednh x\u00e1c. Chuy\u1ebfn \u0111\u00f2 \u0111\u00e3 ghi nh\u1eadn b\u1ea1n kh\u00f4ng \u0111\u1ea1t con d\u1ea5u \u1edf b\u1ebfn n\u00e0y. H\u00e3y ti\u1ebfp t\u1ee5c \u0111\u1ed3ng h\u00e0nh v\u00e0 kh\u00e1m ph\u00e1 c\u00e1c b\u1ebfn ti\u1ebfp theo nh\u00e9!</p>' +\n      (showCert ? '<div style=\"margin-top:16px;\"><button class=\"primary-btn task-primary\" data-certificate=\"1\" style=\"width:100%;padding:12px;font-size:15px;\">M\u1edf trang k\u1ef7 ni\u1ec7m h\u00e0nh tr\u00ecnh \u2197</button></div>' : '') +\n    '</div>';\n    return;\n  }\n  if (isDone(st.id)) {\n    const allFinished = DOCKS.every(d => isDone(d.id) || isFailed(d.id));\n    const showCert = (st.id === 6 || allFinished);\n    area.innerHTML = '<div class=\"task-card stamped-message\"><div class=\"seal-shape\">' + st.icon + '</div><h4>\u0110\u00e3 ghi d\u1ea5u ' + safe(st.seal) + '!</h4><p>Chuy\u1ebfn \u0111\u00f2 \u0111\u00e3 l\u01b0u k\u1ef7 ni\u1ec7m \u1edf b\u1ebfn n\u00e0y v\u00e0o s\u1ed5 c\u1ee7a b\u1ea1n. ' + (st.id < 6 ? 'S\u1eb5n s\u00e0ng cho b\u1ebfn k\u1ebf ti\u1ebfp nh\u00e9.' : 'C\u1ea3m \u01a1n b\u1ea1n \u0111\u00e3 l\u1eafng nghe ph\u01b0\u01a1ng Nam.') + '</p>' + (showCert ? '<div style=\"margin-top:16px;\"><button class=\"primary-btn task-primary\" data-certificate=\"1\" style=\"width:100%;padding:12px;font-size:15px;\">M\u1edf trang k\u1ef7 ni\u1ec7m h\u00e0nh tr\u00ecnh \u2197</button></div>' : '') + '</div>';\n    return;\n  }\n  if (!(s && s.unlocked || []).includes(st.id)) {\n    area.innerHTML = '<div class=\"locked-card\"><div class=\"locked-icon\">\u231b</div><h3>H\u00e3y nghe chuy\u1ec7n \u1edf b\u1ebfn ' + pad(st.id) + '</h3><p>Nhi\u1ec7m v\u1ee5 ch\u01b0a \u0111\u01b0\u1ee3c h\u01b0\u1edbng d\u1eabn vi\u00ean m\u1edf. B\u1ea1n c\u1ee9 theo d\u00f5i ph\u1ea7n di\u1ec5n, khi \u0111\u1ebfn l\u01b0\u1ee3t s\u1ebd t\u1ef1 hi\u1ec7n l\u00ean \u0111\u00e2y nh\u00e9.</p></div>';\n    return;\n  }\n\n  const rawQs = (s && s.questions && (s.questions[st.id] || s.questions[String(st.id)])) || (typeof DEFAULT_QUESTIONS !== 'undefined' ? DEFAULT_QUESTIONS[st.id] : []) || [];\n  const qs = Array.isArray(rawQs) ? rawQs : [rawQs];\n  if (!qs.length) {\n    area.innerHTML = '<div class=\"locked-card\"><h3>Ch\u01b0a c\u00f3 c\u00e2u h\u1ecfi cho b\u1ebfn n\u00e0y</h3></div>';\n    return;\n  }\n\n  if (stationStep[st.id] === undefined) stationStep[st.id] = 0;\n  let step = stationStep[st.id];\n  if (step >= qs.length) step = qs.length - 1;\n  const q = qs[step];\n\n  const opts = (q.options || []).map(o => {\n    if (Array.isArray(o)) return { id: o[0], icon: o[1], text: o[2], desc: o[3] || '', isCorrect: true };\n    return o;\n  });\n\n  const correctOpts = opts.filter(o => o.isCorrect);\n  const isMulti = correctOpts.length >= 2;\n\n  let stepHtml = '';\n  if (qs.length > 1) {\n    const pct = Math.round(((step + 1) / qs.length) * 100);\n    stepHtml = '<div class=\"task-step-indicator\"><span class=\"step-badge\">C\u00c2U ' + (step + 1) + ' / ' + qs.length + '</span><div class=\"step-track\"><div class=\"step-bar\" style=\"width:' + pct + '%\"></div></div></div>';\n  }\n\n  area.innerHTML = '<div class=\"task-card\">' +\n    '<div class=\"task-heading\">' +\n      '<span class=\"task-no\">' + pad(st.id) + '</span>' +\n      '<div><span class=\"smallcap\">NHI\u1ec6M V\u1ee4 \u00b7 D\u1ea4U ' + safe(st.seal.toUpperCase()) + '</span><h3>' + safe(st.title) + '</h3></div>' +\n    '</div>' +\n    stepHtml +\n    '<p class=\"task-prompt\">' + q.prompt + '</p>' +\n    (q.art || '') +\n    '<div class=\"task-options ' + (isMulti ? 'multi-select' : '') + '\">' +\n      opts.map(o => '<button class=\"option-card ' + (selectedAnswers.has(o.id) ? 'selected' : '') + '\" type=\"button\" data-answer=\"' + safe(o.id) + '\">' +\n        '<span class=\"option-emoji\">' + safe(o.icon || '\ud83d\udccc') + '</span>' +\n        '<span class=\"option-text\"><strong>' + safe(o.text) + '</strong>' + (o.desc ? '<small>' + safe(o.desc) + '</small>' : '') + '</span>' +\n        '<span class=\"option-check\">' + (selectedAnswers.has(o.id) ? '\u2713' : '') + '</span>' +\n      '</button>').join('') +\n    '</ -mam') ? '\ud83e\uded9' : '') + (selectedAnswers.has('phoi-kho') ? '\ud83d\udc1f' : '');\n      }\n      return;\n    }\n\n    selectedAnswers = new Set([value]);\n    document.querySelectorAll('#taskArea [data-answer]').forEach(el => el.disabled = true);\n    const matchedOpt = opts.find(o => o.id === value);\n    const isRight = matchedOpt ? !!matchedOpt.isCorrect : false;\n\n    if (!isRight) {\n      toast('\u26a0\ufe0f R\u1ea5t ti\u1ebfc! C\u00e2u tr\u1ea3 l\u1eddi ch\u01b0a ch\u00ednh x\u00e1c. B\u1ea1n \u0111\u00e3 l\u1ee1 con d\u1ea5u b\u1ebfn n\u00e0y.');\n      await markStationFailed(st.id);\n      return;\n    }\n\n    if (st.id === 1) $('canalBoat')?.classList.add('sail');\n    if (st.id === 2) $('poleFruit')?.classList.add('hung');\n\n    stationAnswers[st.id] = stationAnswers[st.id] || [];\n    stationAnswers[st.id].push(value);\n\n    if (step < qs.length - 1) {\n      stationStep[st.id] = step + 1;\n      selectedAnswers.clear();\n      toast('Ch\u00ednh x\u00e1c! Chuy\u1ec3n sang c\u00e2u ' + (step + 2) + '/' + qs.length);\n      taskRenderKey = '';\n      renderTask();\n      renderJourney();\n    } else {\n      await complete(viewStop, stationAnswers[st.id]);\n    }\n    return;\n  }\n\n  if (stepSubmit) {\n    const chosen = [...selectedAnswers];\n    if (!chosen.length) {\n      const hint = $('taskHint');\n      if (hint) hint.textContent = 'B\u1ea1n h\u00e3y ch\u1ecdn c\u00e1c ph\u01b0\u01a1ng \u00e1n tr\u01b0\u1edbc khi x\u00e1c nh\u1eadn nh\u00e9.';\n      return;\n    }\n    const correctIds = correctOpts.map(o => o.id).sort().join();\n    const chosenIds = [...chosen].sort().join();\n\n    if (chosenIds !== correctIds) {\n      stepSubmit.disabled = true;\n      document.querySelectorAll('#taskArea [data-answer]').forEach(el => el.disabled = true);\n      toast('\u26a0\ufe0f R\u1ea5t ti\u1ebfc! \u0110\u00e1p \u00e1n ch\u01b0a ch\u00ednh x\u00e1c. B\u1ea1n \u0111\u00e3 l\u1ee1 con d\u1ea5u b\u1ebfn n\u00e0y.');\n      await markStationFai
